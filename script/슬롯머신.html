<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슬롯머신</title>
</head>

<body>
    <style>
        .count_number {
            display: flex;
            justify-content: flex-end;
            overflow: hidden;
            position: absolute;
            top: -30px;
            right: 0;
            width: 100%;
            height: 220px;
            padding-right: 24px;
            text-align: right;
            font-size: 220px;
            line-height: 220px;
            letter-spacing: -0.035em;
            font-weight: 400;
            color: #f2efe9;
            font-family: 'Monoton';
            font-style: italic;
            z-index: 0;
            transition: transform 2s ease-in;
        }

        .number_strip {
            position: relative;
            transition: transform 2s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: start;
        }

        .number_strip>div {
            height: 220px
        }
    </style>

    <div class="count_number">1996</div>

    <script>
        //DOMContentLoaded = html읽고 DOM트리 생성시 바로 실행(페이지 로딩후에 실행할떄)
        document.addEventListener("DOMContentLoaded", function () {
            const countNumberDiv = document.querySelector('.count_number');
            //trim - 공백제거, split - 여러개의 문자열로 나눠 배열로 반환
            const originalNumbers = countNumberDiv.textContent.trim().split('');
            countNumberDiv.innerHTML = ''; //초기내용 초기화
            //clientHeight - 패딩을 포함한 요소 높이값 (픽셀)
            const height = countNumberDiv.clientHeight;
            //forEach - 배열순회 (num, index에 대한 반복작업)
            originalNumbers.forEach((num, index) => {
                //createElement - 요소추가 , className - 클래스 속성 설정
                //div 생성후 클래스 number_strip 부여
                const numberStrip = document.createElement('div');
                numberStrip.className = 'number_strip';

                //div에 0-9 마크업 만들기 (30인 이유 세번 돌아가게 하기 위해)
                for (let i = 0; i < 30; i++) {
                    numberStrip.innerHTML += `<div>${i % 10}</div>`;
                }
                //appendChild 요소 추가(여기선 위에 for문돌린 숫자 div를 어디에 추가할것인가)
                countNumberDiv.appendChild(numberStrip);

                // 초기 위치 설정
                let startPosition = -height * num;
                numberStrip.style.transform = `translateY(${startPosition}px)`;

                //무한루프 업데이트 함수 
                let intervalId = setInterval(() => {
                    startPosition -= height;  // 다음 숫자로 이동
                    numberStrip.style.transform = `translateY(${startPosition}px)`;
                    // 스크롤 리셋 조정(더이상 내려갈 위치가 없으면 위치리셋)
                    //30개의 아이템의 높이값 만큼 translate에 값 부여
                    if (startPosition <= -30 * height) {
                        startPosition += 30 * height;  // 스크롤 리셋
                        numberStrip.style.transition = 'none';//애니메이션 none시켜서 즉시 위치조정
                        numberStrip.style.transform = `translateY(${startPosition}px)`;
                        //위치 초기화 후 애니메이션 다시 설정
                        setTimeout(() => {
                            numberStrip.style.transition = 'transform 0.2s linear';
                        }, 50);
                    }
                }, 300);  // 0.3초마다 숫자 업데이트

                //3초 후에 인터벌 중단후 최종위치로 이동
                setTimeout(() => {
                    clearInterval(intervalId); //
                    numberStrip.style.transition = 'transform 2s ease-out';
                    numberStrip.style.transform = `translateY(-${height * num}px)`;  // 최종 목표 위치
                }, 2500 + 300 * index);  // 2.5초 후 첫 자리부터 0.3초 간격
            });
        });
    </script>
</body>

</html>
